name: Deploy to Hostinger

# -----------------------------------------------------------------------------
# Build + FTPS deploy pipeline for Hostinger shared hosting (Single plan,
# no SSH). The runner builds the React frontend, installs Composer prod
# dependencies, writes a production `.env` from GitHub Secrets, assembles
# the Hostinger folder layout (backend/ + public_html/) and uploads the
# whole thing to the FTP root. After the deploy, pings the maintenance
# bootstrap endpoint to run migrations + create the storage symlink.
#
# Triggered on every push to `main`, and manually via workflow_dispatch
# for a dry-run or forced redeploy.
# -----------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------- Backend : PHP + Composer prod deps --------
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_mysql, zip, gd, intl, xml
          coverage: none
          tools: composer:v2

      - name: Composer install (prod)
        working-directory: ./backend
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          composer dump-autoload --optimize --no-dev

      # -------- Frontend : Node + Vite build --------
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: ./frontend
        env:
          # Sentry (côté client) : injecté à la compilation Vite. Vide =
          # Sentry désactivé (no-op dans src/sentry.ts). Le DSN n'étant pas
          # un secret dur (il figure dans le JS publié), le committer en
          # secret GitHub reste la bonne pratique pour pouvoir le changer
          # sans toucher au code.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENV: production
          VITE_APP_VERSION: ${{ github.sha }}
        run: |
          npm ci
          npm run build

      # -------- Staging : assemble Hostinger folder layout --------
      - name: Assemble staging dir
        run: |
          set -euo pipefail
          mkdir -p staging/backend
          mkdir -p staging/public_html

          # Copy backend (excluding dev/test artifacts). rsync-with-excludes.
          rsync -a \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='.phpunit.result.cache' \
            --exclude='tests/' \
            --exclude='.git/' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/testing/*' \
            --exclude='node_modules/' \
            backend/ staging/backend/

          # Keep storage/ writable scaffolding (Laravel expects these dirs).
          mkdir -p staging/backend/storage/logs
          mkdir -p staging/backend/storage/framework/cache/data
          mkdir -p staging/backend/storage/framework/sessions
          mkdir -p staging/backend/storage/framework/views
          mkdir -p staging/backend/storage/app/public
          mkdir -p staging/backend/bootstrap/cache
          touch staging/backend/storage/logs/.gitkeep

          # Frontend build output → public_html
          cp -r frontend/dist/* staging/public_html/

          # Hostinger-specific bootstrap + Apache config → public_html
          cp .github/hostinger/index.php staging/public_html/
          cp .github/hostinger/.htaccess staging/public_html/

          # Write production .env to backend/
          cat > staging/backend/.env <<ENVEOF
          APP_NAME="Rene Football"
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=https://renefootball.com
          APP_KEY=${{ secrets.APP_KEY }}
          APP_LOCALE=fr
          APP_FALLBACK_LOCALE=en
          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_LEVEL=warning

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          SESSION_DRIVER=database
          SESSION_LIFETIME=10080
          SESSION_ENCRYPT=false
          SESSION_SECURE_COOKIE=true
          SESSION_HTTP_ONLY=true
          SESSION_SAME_SITE=lax
          SESSION_DOMAIN=.renefootball.com

          CACHE_STORE=database
          QUEUE_CONNECTION=database

          MAIL_MAILER=smtp
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_ENCRYPTION=ssl
          MAIL_FROM_ADDRESS=${{ secrets.MAIL_USERNAME }}
          MAIL_FROM_NAME="Rene Football"
          CONTACT_RECIPIENT=${{ secrets.MAIL_USERNAME }}

          FILESYSTEM_DISK=local
          SANCTUM_EXPIRATION_MINUTES=10080

          MAINT_SECRET=${{ secrets.MAINT_SECRET }}

          SENTRY_LARAVEL_DSN=${{ secrets.SENTRY_LARAVEL_DSN }}
          SENTRY_TRACES_SAMPLE_RATE=0.1
          SENTRY_SEND_DEFAULT_PII=false
          SENTRY_RELEASE=${{ github.sha }}
          ENVEOF

          echo "----- Staging layout -----"
          ls -la staging/
          du -sh staging/backend staging/public_html

      # -------- Package backend as a single zip ----------
      # Hostinger shared sans SSH : impossible de lancer composer install sur
      # le serveur. On zippe vendor/+app/+… en local pour upload d'UN SEUL
      # fichier (50-80 MB) au lieu de 5000+ petits fichiers individuels
      # (chaque création de dossier via FTP coûte ~0.5-1s, PhpSpreadsheet
      # seul = ~800 dossiers → impossible à finir dans la fenêtre du runner).
      - name: Package backend as single zip
        run: |
          set -euo pipefail
          cd staging
          zip -rq backend.zip backend/
          rm -rf backend/
          ls -lh backend.zip

      - name: Generate _extract.php with injected MAINT_SECRET
        env:
          MAINT_SECRET: ${{ secrets.MAINT_SECRET }}
        run: |
          # MAINT_SECRET est un hex pur (généré via `openssl rand -hex 32`),
          # donc aucun caractère spécial à escaper pour sed. On substitue
          # directement sans passer par `printf '%s\n'` qui ajoutait un \n
          # final au secret → hash_equals échouait côté PHP.
          sed "s/__MAINT_SECRET__/${MAINT_SECRET}/g" \
            .github/hostinger/_extract.php.template > staging/public_html/_extract.php
          echo "_extract.php generated ($(wc -c < staging/public_html/_extract.php) bytes)"
          # Vérifie que le placeholder a bien été substitué (ne doit pas apparaître)
          if grep -q '__MAINT_SECRET__' staging/public_html/_extract.php; then
            echo "::error::__MAINT_SECRET__ placeholder non substitué dans _extract.php"
            exit 1
          fi
          # Diagnostic : affiche la longueur de la string $expected pour vérifier
          # qu'il n'y a pas de char invisible (le secret fait 64 chars hex).
          EXPECTED_LEN=$(grep -o "trim('[^']*')" staging/public_html/_extract.php | head -1 | awk -F"'" '{print length($2)}')
          echo "Longueur du secret substitué: ${EXPECTED_LEN} chars (attendu: 64)"

      # -------- FTPS deploy (small payload — ~50 MB zip + ~50 React files) --------
      # Hostinger shared : la racine FTP par défaut (/home/u439221818/) n'est
      # PAS le document root. Le web pour renefootball.com sert depuis
      # /home/u439221818/domains/renefootball.com/public_html/.
      # On upload donc dans /domains/renefootball.com/ qui va créer :
      #   /domains/renefootball.com/backend.zip
      #   /domains/renefootball.com/public_html/*  (React dist + .htaccess + index.php + _extract.php)
      # Après extraction, backend/ se retrouvera dans /domains/renefootball.com/backend/
      # qui est exactement ce que index.php attend (require ../backend/vendor/autoload.php).
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./staging/
          server-dir: /domains/renefootball.com/
          state-name: .ftp-deploy-renefb-v2.json
          timeout: 180000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # -------- Extract backend.zip on the server (via standalone PHP) --------
      # _extract.php lit backend.zip et dézippe dans ../backend/ (= à la racine
      # FTP, à côté de public_html/). Puis supprime le zip. Protégé par le
      # MAINT_SECRET injecté au build.
      - name: Extract backend.zip on server
        env:
          MAINT_SECRET: ${{ secrets.MAINT_SECRET }}
        run: |
          echo "Waiting 10s for Hostinger to pick up new files..."
          sleep 10
          for i in 1 2 3 4 5; do
            echo "--- Extract attempt $i ---"
            HTTP=$(curl -s -o /tmp/extract.json -w "%{http_code}" \
              -X POST "https://renefootball.com/_extract.php" \
              -H "X-Maint-Secret: ${MAINT_SECRET}" \
              --max-time 180 || echo "000")
            echo "HTTP: $HTTP"
            cat /tmp/extract.json 2>/dev/null || true
            echo ""
            if [[ "$HTTP" -ge 200 && "$HTTP" -lt 300 ]]; then
              echo "::notice::Extract succeeded on attempt $i"
              break
            fi
            if [[ $i -lt 5 ]]; then
              echo "Retrying in 15s..."
              sleep 15
            fi
          done

      # -------- Post-deploy : bootstrap (migrations + symlink) --------
      - name: Trigger maintenance bootstrap
        env:
          MAINT_SECRET: ${{ secrets.MAINT_SECRET }}
        run: |
          for i in 1 2 3 4 5; do
            echo "--- Bootstrap attempt $i ---"
            HTTP=$(curl -s -o /tmp/boot.json -w "%{http_code}" \
              -X POST "https://renefootball.com/api/_maintenance/bootstrap" \
              -H "X-Maint-Secret: ${MAINT_SECRET}" \
              -H "Accept: application/json" \
              --max-time 90 || echo "000")
            echo "HTTP: $HTTP"
            cat /tmp/boot.json 2>/dev/null || true
            echo ""
            if [[ "$HTTP" -ge 200 && "$HTTP" -lt 300 ]]; then
              echo "::notice::Bootstrap succeeded on attempt $i"
              exit 0
            fi
            if [[ $i -lt 5 ]]; then
              echo "Retrying in 10s..."
              sleep 10
            fi
          done
          echo "::warning::Bootstrap failed after 5 attempts. Deploy is still live — try manually via curl later."

      - name: Deploy summary
        if: always()
        run: |
          echo "## Deploy result" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://renefootball.com" >> $GITHUB_STEP_SUMMARY
          echo "- Health: https://renefootball.com/api/_maintenance/health" >> $GITHUB_STEP_SUMMARY
