<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Start loading the public roster right away (first thing in <head>,
      // before any stylesheet can hold inline scripts back), in parallel with the
      // app's JavaScript, so the home hero doesn't wait for it to boot.
      // usePublicPlayers() picks the data up instead of fetching again.
      // On the home page, the first hero portrait is preloaded as soon as the
      // list arrives, so it doesn't wait for the app's first render.
      (function () {
        var path = location.pathname;
        if (path.indexOf('/admin') === 0 || path.indexOf('/p/') === 0) return;

        // Same pick as the hero: real photos only, most minutes played first,
        // then goals + assists (HomePage: pickShowcase + hasRealPhoto).
        var preloaded = null;
        function preloadHero(players) {
          var withPhoto = players.filter(function (p) {
            return p.photo_url && p.photo_url.indexOf('picsum.photos') === -1;
          });
          if (!withPhoto.length) return;
          withPhoto.sort(function (a, b) {
            var m = (b.minutes_played || 0) - (a.minutes_played || 0);
            if (m !== 0) return m;
            return ((b.goals || 0) + (b.assists || 0)) - ((a.goals || 0) + (a.assists || 0));
          });
          var href = withPhoto[0].photo_display_url || withPhoto[0].photo_url;
          if (href === preloaded) return;
          preloaded = href;
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = href;
          link.setAttribute('fetchpriority', 'high');
          document.head.appendChild(link);
        }

        // List kept from a previous visit (written by usePublicPlayers): a
        // returning visitor sees the players at once, while the fresh list
        // below replaces it. Public data only, ignored after 7 days.
        try {
          var cached = JSON.parse(localStorage.getItem('rf_players_cache') || 'null');
          if (cached && Array.isArray(cached.data) && Date.now() - cached.at < 7 * 864e5) {
            window.__rfPlayersCached = cached.data;
            if (path === '/') preloadHero(cached.data);
          }
        } catch (_) {}

        try {
          window.__rfPlayers = fetch('/api/players', { headers: { Accept: 'application/json' } })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (res) {
              if (res && res.data) {
                window.__rfPlayersData = res.data;
                if (path === '/') preloadHero(res.data);
              }
              return res;
            })
            .catch(function () { return null; });
        } catch (_) {}

        // Public settings (footer links, contact, the home hero chosen in
        // Réglages). The hero name is kept for the next visit so the right
        // hero shows at once (useHeroVariant).
        try {
          window.__rfSettings = fetch('/api/settings', { headers: { Accept: 'application/json' } })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (res) {
              if (res && res.data) {
                window.__rfSettingsData = res.data;
                var hero = res.data.appearance && res.data.appearance.hero_variant;
                try { if (hero) localStorage.setItem('rf_hero_variant', hero); } catch (_) {}
              }
              return res;
            })
            .catch(function () { return null; });
        } catch (_) {}
      })();
    </script>

    <!-- Primary : base title & description shipped in the static HTML so
         non-JS crawlers (social scrapers, older bots) always see something.
         Per-route pages override these client-side via react-helmet-async
         once React mounts. -->
    <title>Rene Football · Agence de football au Luxembourg</title>
    <meta name="description" content="Agent FIFA licencié basé au Luxembourg. Représentation de joueurs, négociation de transferts, scouting et gestion de carrière, en activité depuis 2010." />
    <meta name="author" content="Rene Football" />
    <meta name="keywords" content="agence de football, agent FIFA, Luxembourg, représentation joueur, scouting football, transferts, Rene Football, René Jacob Yougbaré" />
    <meta name="theme-color" content="#0a1f3d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://renefootball.com/" />

    <!-- Icons — real Rene Football monogram. Black on light tabs,
         white on dark tabs (per prefers-color-scheme). Apple touch icon
         defaults to the black variant so iOS home-screen thumbnails read
         on the standard light shortcut background. -->
    <link rel="icon" type="image/png" sizes="500x500" href="/logo-black.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="500x500" href="/logo-white.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="500x500" href="/logo-black.png" />
    <link rel="apple-touch-icon" href="/logo-black.png" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack, iMessage…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rene Football" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://renefootball.com/" />
    <meta property="og:title" content="Rene Football · Agence de football au Luxembourg" />
    <meta property="og:description" content="Agent FIFA licencié basé au Luxembourg. Représentation, transferts, scouting et gestion de carrière depuis 2010." />
    <meta property="og:image" content="https://renefootball.com/logo-black.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rene Football, propulseur de talents" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rene Football · Agence de football au Luxembourg" />
    <meta name="twitter:description" content="Agent FIFA licencié basé au Luxembourg. Représentation, transferts, scouting et gestion de carrière depuis 2010." />
    <meta name="twitter:image" content="https://renefootball.com/logo-black.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- JSON-LD structured data (SportsOrganization). Injected in the static
         HTML so search engines pick it up without executing JS. Feeds the
         Knowledge Panel with the right name, logo, founder, address, contact. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SportsOrganization",
      "name": "Rene Football",
      "alternateName": "Rene Football, agence de football",
      "url": "https://renefootball.com/",
      "logo": "https://renefootball.com/logo-black.png",
      "description": "Agence de football basée au Luxembourg. Représentation de joueurs, négociation de transferts, scouting et gestion de carrière.",
      "foundingDate": "2010",
      "founder": {
        "@type": "Person",
        "name": "René Jacob Yougbaré",
        "jobTitle": "Fondateur, Agent FIFA licencié"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "LU",
        "addressLocality": "Luxembourg"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "renefootball.p@gmail.com",
        "telephone": "+352-691-712-574",
        "areaServed": "EU",
        "availableLanguage": ["French", "English"]
      },
      "sameAs": []
    }
    </script>

    <script>
      // Apply the dark class BEFORE React mounts so the very first paint
      // is already dark - avoids the white flash while ThemeProvider boots.
      // Mirrors ThemeContext.readInitial(): honour the stored choice,
      // otherwise default to dark.
      (function () {
        try {
          var stored = localStorage.getItem('rene_theme');
          var theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (_) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
