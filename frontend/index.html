<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-black.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rene Football - agence de football. Représentation de joueurs, négociation de transferts, scouting et gestion de carrière." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Rene Football - Agence de football</title>
    <script>
      // Apply the dark class BEFORE React mounts so the very first paint
      // is already dark — avoids the white flash while ThemeProvider boots.
      // Mirrors ThemeContext.readInitial(): honour the stored choice,
      // otherwise default to dark.
      (function () {
        try {
          var stored = localStorage.getItem('rene_theme');
          var theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (_) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
